name: Build sacar_datos executable

# Es dispara manualment o en crear un tag v*
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: sacar_datos
            artifact_label: sacar_datos-mac
          - os: windows-latest
            artifact_name: sacar_datos.exe
            artifact_label: sacar_datos-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instal·lar dependències
        run: pip install -r requirements.txt pyinstaller

      # Genera _baked_creds.py amb les credencials des dels Secrets de GitHub.
      # Aquest fitxer mai s'ha de comitejar (està al .gitignore).
      - name: Crear fitxer de credencials embegudes
        shell: python
        env:
          ADTENDE_USERNAME: ${{ secrets.ADTENDE_USERNAME }}
          ADTENDE_PASSWORD: ${{ secrets.ADTENDE_PASSWORD }}
        run: |
          import os
          username = os.environ["ADTENDE_USERNAME"]
          password = os.environ["ADTENDE_PASSWORD"]
          with open("_baked_creds.py", "w", encoding="utf-8") as f:
              f.write(f"BAKED_USERNAME = {repr(username)}\n")
              f.write(f"BAKED_PASSWORD = {repr(password)}\n")
          print("OK: _baked_creds.py creat")

      - name: Compilar executable
        run: |
          pyinstaller \
            --onefile \
            --name sacar_datos \
            --hidden-import=dotenv \
            --hidden-import=pandas \
            --hidden-import=requests \
            --hidden-import=openpyxl \
            sacar_datos.py

      - name: Pujar artefacte
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_label }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  # Crea un Release de GitHub amb tots dos executables adjunts
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Baixar artefacte Mac
        uses: actions/download-artifact@v4
        with:
          name: sacar_datos-mac
          path: artifacts/mac

      - name: Baixar artefacte Windows
        uses: actions/download-artifact@v4
        with:
          name: sacar_datos-windows
          path: artifacts/windows

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/sacar_datos
            artifacts/windows/sacar_datos.exe
          body: |
            ## Instruccions d'ús

            ### Mac
            1. Baixa `sacar_datos`
            2. Obre Terminal i executa: `chmod +x sacar_datos && ./sacar_datos`
               (la primera vegada macOS pot demanar permís a Preferències > Privacitat)

            ### Windows
            1. Baixa `sacar_datos.exe`
            2. Fes doble clic (si Windows Defender avisa, clica "Més informació" → "Executa igualment")
